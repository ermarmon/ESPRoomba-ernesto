substitutions:
  name: "irobot"
  friendly_name: "iRobot"
  id: "irobot"
  project_name: "ESP32C3.Super-Mini"
  project_version: "1.0"
  # BRC pin, uart_bus, polling interval in milliseconds, wake up 650+ series
  init: 'RoombaComponent::instance(10, id(uart_bus), 10000, true);'

external_components:
  - source:
      type: git
      url: https://github.com/robertklep/esphome-custom-component
      ref: 3bb2da2112ad0aef2163e4bfc694cac6d33c0cf0
    components: [ custom, custom_component ]

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  project:
    name: "${project_name}"
    version: "${project_version}"
  includes:
   - custom_components/RoombaProtocol.h
   - custom_components/Roomba.h

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

# Enable logging
logger:

# Enable Home Assistant API
api:
  custom_services: true
  encryption:
    key: !secret REDACTED

ota:
  - platform: esphome
    password: !secret REDACTED

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: !secret REDACTED
    password: !secret REDACTED

captive_portal:
    
web_server:
  port: 80
  version: 3

status_led:
  pin:
    number: GPIO8
    inverted: true

esp32_ble_beacon:
  type: iBeacon
  tx_power: 9
  measured_power: -74
  uuid: f228a856-cc91-6ae6-5829-fb677292c386

uart:
  id: uart_bus
  tx_pin: 6
  rx_pin: 7
  baud_rate: 115200
  # Fixed sensor-list response: 22 bytes.
  rx_full_threshold: 22
  rx_timeout: 10
  # UART debug deliberately disabled.

# Enable startup debug info
debug:

time:
  - platform: homeassistant
    id: my_time
    on_time:
      - seconds: 0
        minutes: 0
        hours: 5
        then:
          - button.press: set_date

custom_component:
  - lambda: |-
      auto r = ${init}
      return {r};
    id: my_roomba

# ============================================================================
# BINARY SENSORS
# ============================================================================
binary_sensor:
  # --- Sensores originales ---
  - platform: custom
    lambda: |-
        auto r = ${init}
        return {r->vacuumSensor, r->virtualWallSensor, r->chargingSourcesSensor};
    binary_sensors:
      - name: "${name} vacuum state"
        id: "${id}_vacuum"
      - name: "${name} virtual wall"
      - name: "${name} charging source available"

  # Evidence for accounting; existing vacuum state remains command feedback.
  - platform: template
    name: "${name} confirmed cleaning"
    id: "${id}_confirmed_cleaning"
    lambda: |-
      auto r = ${init}
      return r->confirmed_cleaning();

  # --- WATCHDOG: Roomba atascada o sin respuesta ---
  # Se activa si: pérdida OI >90s, limpiando sin actividad >4min,
  # o batería <15% + sin actividad >2min
  - platform: template
    name: "${name} stuck or unresponsive"
    id: "${id}_stuck"
    device_class: problem
    lambda: |-
      std::string activity = id(${id}_activity).state;
      float inactivity = id(${id}_last_activity).state;
      float oi_timeout = id(${id}_oi_timeout).state;
      float battery = id(${id}_battery).state;

      // CASO 1: Pérdida total de comunicación OI >90s
      if (!isnan(oi_timeout) && oi_timeout > 90) {
        return true;
      }
      // CASO 2: Limpiando sin actividad física >4 minutos
      if (activity == "Cleaning" && !isnan(inactivity) && inactivity > 240) {
        return true;
      }
      // CASO 3: Limpiando + batería crítica + sin actividad >2 minutos
      if (activity == "Cleaning" && !isnan(battery) &&
          battery < 15 && !isnan(inactivity) && inactivity > 120) {
        return true;
      }
      return false;
    filters:
      - delayed_on: 30s   # Espera 30s antes de activar (evita falsos positivos)
      - delayed_off: 10s  # Espera 10s antes de desactivar (evita parpadeos)

  # --- WATCHDOG: Comunicación OI OK ---
  - platform: template
    name: "${name} responsive"
    id: "${id}_responsive"
    device_class: connectivity
    lambda: |-
      auto r = ${init}
      return r->communication_fresh();

  # --- WATCHDOG: Necesita atención (health score bajo) ---
  - platform: template
    name: "${name} needs attention"
    id: "${id}_needs_attention"
    device_class: problem
    lambda: |-
      float health = id(${id}_health_score).state;
      return !isnan(health) && health < 50;
    filters:
      - delayed_on: 60s
      - delayed_off: 30s

# ============================================================================
# SENSORS
# ============================================================================
sensor:
  - platform: wifi_signal
    name: "${friendly_name} WiFi Signal"
    update_interval: 60s

  - platform: internal_temperature
    name: "Internal Temperature"

  # --- Sensores originales del custom component ---
  - platform: custom
    lambda: |-
        auto r = ${init}
        return {r->voltageSensor, r->currentSensor, r->batteryChargeSensor, r->batteryCapacitySensor, r->batteryPercentSensor, r->batteryTemperatureSensor, r->driveSpeedSensor, r->rightMotorCurrentSensor, r->leftMotorCurrentSensor, r->mainBrushCurrentSensor, r->sideBrushCurrentSensor};
    sensors:
      - name: "${name} voltage"
        id: "${id}_voltage"
        unit_of_measurement: "V"
        icon: mdi:sine-wave
        accuracy_decimals: 2
      - name: "${name} current"
        id: "${id}_current"
        unit_of_measurement: "A"
        icon: mdi:lightning-bolt
        accuracy_decimals: 3
      - name: "${name} charge"
        unit_of_measurement: "Ah"
        icon: mdi:battery-charging
        accuracy_decimals: 2
      - name: "${name} capacity"
        unit_of_measurement: "Ah"
        icon: mdi:battery
        accuracy_decimals: 2
      - name: "${name} battery"
        id: "${id}_battery"
        unit_of_measurement: "%"
        state_class: "measurement"
        device_class: battery
        icon: mdi:battery-outline
        accuracy_decimals: 0
      - name: "${name} temperature"
        unit_of_measurement: "°C"
        icon: mdi:thermometer
        accuracy_decimals: 0
      - name: "${name} drive speed"
        id: "${id}_drive_speed"
        unit_of_measurement: "mm/s"
        accuracy_decimals: 0
      - name: "${name} right motor current"
        id: "${id}_right_motor_current"
        unit_of_measurement: "A"
        icon: mdi:lightning-bolt
        accuracy_decimals: 2
      - name: "${name} left motor current"
        id: "${id}_left_motor_current"
        unit_of_measurement: "A"
        icon: mdi:lightning-bolt
        accuracy_decimals: 2
      - name: "${name} main brush current"
        id: "${id}_main_brush_current"
        unit_of_measurement: "A"
        icon: mdi:lightning-bolt
        accuracy_decimals: 2
      - name: "${name} side brush current"
        id: "${id}_side_brush_current"
        unit_of_measurement: "A"
        icon: mdi:lightning-bolt
        accuracy_decimals: 2

  # Monotonic per boot: proves new UART packets arrive even if values are constant.
  - platform: template
    name: "${name} OI valid responses"
    entity_category: diagnostic
    state_class: total_increasing
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      auto r = ${init}
      return r->valid_responses();

  - platform: template
    name: "${name} OI invalid responses"
    entity_category: diagnostic
    state_class: total_increasing
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      auto r = ${init}
      return r->invalid_responses();

  # Conservative elapsed time between consecutive valid cleaning samples.
  # Resets on ESP restart; total_increasing allows HA statistics to handle resets.
  - platform: template
    name: "${name} confirmed cleaning time"
    id: "${id}_confirmed_cleaning_time"
    unit_of_measurement: "s"
    device_class: duration
    state_class: total_increasing
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      auto r = ${init}
      return r->confirmed_cleaning_seconds();

  # --- WATCHDOG: Segundos desde última actividad física detectada ---
  # Solo corriente de motores en paquetes válidos; no ruido de batería/voltaje.
  - platform: template
    name: "${name} seconds since last activity"
    id: "${id}_last_activity"
    unit_of_measurement: "s"
    device_class: duration
    state_class: measurement
    update_interval: 5s
    accuracy_decimals: 0
    lambda: |-
      auto r = ${init}
      return r->inactivity_age();

  # --- WATCHDOG: Segundos desde última comunicación OI válida ---
  # Detecta pérdida total de comunicación ESP32-Roomba
  - platform: template
    name: "${name} OI communication timeout"
    id: "${id}_oi_timeout"
    unit_of_measurement: "s"
    device_class: duration
    state_class: measurement
    update_interval: 10s
    accuracy_decimals: 0
    lambda: |-
      auto r = ${init}
      return r->communication_age();

  # --- WATCHDOG: Puntuación de salud 0-100% ---
  # Combina timeout de comunicación e inactividad física
  - platform: template
    name: "${name} health score"
    id: "${id}_health_score"
    unit_of_measurement: "%"
    state_class: measurement
    update_interval: 15s
    accuracy_decimals: 0
    lambda: |-
      float health = 100.0;

      // Penalización por timeout de comunicación OI
      float oi_timeout = id(${id}_oi_timeout).state;
      if (!isnan(oi_timeout)) {
        if      (oi_timeout > 120) health -= 100;
        else if (oi_timeout >  60) health -= 60;
        else if (oi_timeout >= 30) health -= 40;
      }

      // Penalización por inactividad SOLO si está limpiando
      std::string activity = id(${id}_activity).state;
      float inactivity = id(${id}_last_activity).state;
      if (activity == "Cleaning" && !isnan(inactivity)) {
        if      (inactivity > 300) health -= 35;
        else if (inactivity > 180) health -= 20;
        else if (inactivity > 120) health -= 10;
      }

      // Penalización extra: batería baja + limpiando + sin actividad
      float battery = id(${id}_battery).state;
      if (!isnan(battery) && activity == "Cleaning" &&
          battery < 15 && inactivity > 60) {
        health -= 20;
      }

      return max(0.0f, min(100.0f, health));

# ============================================================================
# TEXT SENSORS
# ============================================================================
text_sensor:
  - platform: wifi_info
    ip_address:
      name: ${friendly_name} IP Address
    ssid:
      name: ${friendly_name} SSID
    bssid:
      name: ${friendly_name} BSSID
    mac_address:
      name: ${friendly_name} MAC Address

  # --- Sensores originales del custom component ---
  - platform: custom
    lambda: |-
      auto r = ${init}
      return {r->chargingSensor, r->activitySensor, r->oiModeSensor, r->buttonsSensor};
    text_sensors:
      - name: "${name} charging state"
      - name: "${name} activity"
        id: "${id}_activity"
      - name: "${name} OI mode"
        id: "${id}_oi_mode"
      - name: "${name} pressed button"

# ============================================================================
