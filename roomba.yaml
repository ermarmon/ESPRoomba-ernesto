# ============================================================================
# SWITCHES
# ============================================================================
switch:
  - platform: template
    name: "${friendly_name} Vacuum"
    lambda: |-
      return id(${id}_vacuum).state;
    turn_on_action:
      - lambda: |-
          auto r = ${init}
          r->send_command("vacuum_on");
    turn_off_action:
      - lambda: |-
          auto r = ${init}
          r->send_command("vacuum_off");

  - platform: template
    name: "${friendly_name} Safe Mode"
    lambda: |-
      if (id(${id}_oi_mode).state == "safe") {
        return true;
      } else {
        return false;
      }
    turn_on_action:
      - lambda: |-
          auto r = ${init}
          r->send_command("safe");
    turn_off_action:
      - lambda: |-
          auto r = ${init}
          r->send_command("passive");